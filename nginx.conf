# nginx pour le site statique de la documentation (écoute sur 8080, sans privilèges).
server {
  # IPv4 seulement : Traefik (Dokploy) joint le conteneur en IPv4, et un hôte sans IPv6 ferait échouer `listen [::]`.
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Le site est construit en « dossiers » (/page/index.html) : /page/ est servi, /page redirige vers /page/.
  absolute_redirect off;
  port_in_redirect off;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

  # En-têtes de sécurité : dans security-headers.conf, inclus dans CHAQUE location (un `add_header` dans une location efface ceux du niveau au-dessus).

  # Santé : pour le contrôle de l'image Docker et de Dokploy.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Fichiers avec empreinte dans leur nom (/_astro) : cache d'un an, jamais à revalider.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }

  # Index de recherche (Pagefind) : le nom des fichiers change à chaque construction, mais l'index principal doit se revalider.
  location /pagefind/ {
    add_header Cache-Control "public, max-age=3600" always;
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }

  # Pages : toujours revalidées (une correction de la documentation se voit tout de suite, sans purger de cache).
  location / {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security-headers.conf;
    try_files $uri $uri/index.html $uri/ =404;
  }

  # Pages introuvables : la 404 de la langue (l'anglais sous /en/).
  error_page 404 /404.html;
  location ^~ /en/ {
    error_page 404 /en/404/index.html;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security-headers.conf;
    try_files $uri $uri/index.html $uri/ =404;
  }
}
