# En-têtes de sécurité, inclus dans chaque location de nginx.conf.
# `unsafe-inline` : Starlight pose un petit script (thème) et quelques attributs style dans la page ; `wasm-unsafe-eval` : la recherche (Pagefind) est du WebAssembly.
# Rien n'est chargé hors de ce site : pas de police, de script ni d'image tiers.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
